<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KnowledgeVault</title>

    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Inter font by google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- external CSS -->
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <!-- header -->
    <header>
      <!-- navbar -->
      <nav class="container navbar">
        <img src="./assets/logo-navbar.png" alt="logo-navbar" />
        <ul>
          <li><a href="">Features</a></li>
          <li><a href="">How It Works</a></li>
          <li><a href="">Why It's Different</a></li>
        </ul>
        <button class="btn">Get Early Access</button>
      </nav>

      <!-- banner section -->
      <section class="banner">
        <section class="banner-container">
          <div class="banner-access">
            <img src="./assets/spinner.png" alt="spinner" />
            <h4>Early Access Now Open</h4>
          </div>
          <div class="banner-titles">
            <h2>Structured Thinking,</h2>
            <h3>Not Just Note-Taking.</h3>
          </div>
          <p>
            A private space to store notes, links, and learning summaries —
            designed to help you think clearly, connect ideas, and turn learning
            into long-term knowledge.
          </p>
          <div>
            <button class="btn">
              Start Buidling Your Vault<i
                style="padding-left: 10px; padding-right: 16px"
                class="fa-solid fa-arrow-right"
              ></i>
            </button>
            <button class="btn banner-btn"><i class="fa-solid fa-play"></i> See How It Works</button>
          </div>
        </section>
      </section>
    </header>

    <!-- main -->
    <main></main>

    <!-- footer -->
    <footer></footer>
  </body>
</html>
